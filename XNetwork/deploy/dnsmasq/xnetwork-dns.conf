# XNetwork LAN resolver.
#
# This exists so bypass rules can match services by domain. Some services (TikTok is the
# reason this was built) resolve into shared CDN space that also fronts unrelated sites,
# so a static CIDR would either miss most of their traffic or divert traffic that should
# stay on the tunnel. dnsmasq instead watches real DNS answers and adds them to an
# nftables set that the bypass rule matches.
#
# Deliberately separate from the cudy-wan-dhcp dnsmasq instance, which serves DHCP with
# port=0. That one keeps working untouched if this resolver is stopped or removed.

# Answer only on the LAN address. bind-dynamic avoids colliding with systemd-resolved on
# 127.0.0.53 and tolerates eth0 appearing late at boot.
interface=eth0
bind-dynamic
port=53

# DHCP belongs to cudy-wan-dhcp.service; never hand out leases from here.
no-dhcp-interface=eth0

# Do not inherit the host's resolv.conf: it points at Tailscale MagicDNS, so LAN name
# resolution would break whenever Tailscale was down.
no-resolv
server=1.1.1.1
server=8.8.8.8
server=1.0.0.1

# Tailscale MagicDNS is preserved by forwarding tailnet names to it explicitly. This does
# not change how the Pi itself resolves (that still goes through resolv.conf ->
# 100.100.100.100); it additionally lets LAN clients resolve tailnet hosts, which they
# could not do while pointed at 8.8.8.8.
server=/ts.net/100.100.100.100

# Ignore upstream answers that point at private space, a common redirection failure mode.
stop-dns-rebind
rebind-localhost-ok
# MagicDNS answers are 100.64.0.0/10 shared address space, which rebind protection would
# otherwise be entitled to strip.
rebind-domain-ok=/ts.net/

cache-size=1000
domain-needed
bogus-priv

# Generated by xnetwork-traffic-bypass-apply from the saved bypass rules. Created empty at
# deploy time so this resolver starts cleanly before any domain rule exists.
conf-file=/etc/xnetwork/dnsmasq-bypass-domains.conf
