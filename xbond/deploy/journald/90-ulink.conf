# uLink journald caps.
#
# Both the router and the tunnel server previously ran journald on defaults, which let the journal
# grow to ~3.9 GB and churn disk writes continuously. uLink's own diagnostics live in
# /run/xbond/*-status.json, so long journal retention buys very little here.
[Journal]
SystemMaxUse=512M
SystemMaxFileSize=64M
RuntimeMaxUse=64M
