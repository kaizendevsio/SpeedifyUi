enabled = false
session_id = 1
server_addr = "45.77.241.247:8444"
mode = "anchor-duplicate-1"
max_active_backups = 1
realtime_deadline_ms = 500
tun_queue_capacity = 2048
inbound_queue_capacity = 4096
udp_socket_buffer_bytes = 8388608
udp_receive_batch_size = 32
heartbeat_interval_ms = 200
heartbeat_health_window_samples = 100
heartbeat_min_quality_samples = 20
heartbeat_failure_consecutive = 4
heartbeat_recovery_consecutive = 15
runtime_status_path = "/run/xbond/client-status.json"

[[paths]]
id = 1
name = "Stable primary"
interface_name = "eth0"
bind_addr = "0.0.0.0:0"
enabled = true

[[paths]]
id = 2
name = "Backup modem"
interface_name = "wwan0"
bind_addr = "0.0.0.0:0"
enabled = true

# Anchor stability. Defaults are sticky on purpose: an anchor switch moves all bulk
# traffic in balanced/fast, so a candidate must beat the anchor by a wide margin, stay
# ahead for stable_ticks_required ticks, then survive a mirrored-load trial.
[role_selection]
anchor_switch_score_margin = 200.0
backup_switch_score_margin = 100.0
stable_ticks_required = 10
smoothing_alpha = 0.2
variance_penalty_weight = 2.0
flap_penalty_demoted = 1000.0
flap_penalty_trial_failed = 600.0
flap_suppress_threshold = 500.0
flap_penalty_cap = 4000.0
flap_half_life_secs = 300
# Grace window for a hard-demoted anchor to recover before its penalty becomes final. A
# loaded line can saturate its queue for a single second; without this it would be exiled
# for a half-life and traffic would sit on a worse path.
flap_transient_grace_ticks = 5
# Latency-first anchor preference: the path whose average heartbeat RTT beats the
# anchor's by latency_advantage_ms for latency_stable_ticks consecutive seconds earns a
# trial, and any promotion (score- or latency-triggered) requires holding latency within
# trial_latency_margin_ms of the anchor under mirrored load. Set latency_stable_ticks = 0
# to disable the latency trigger.
latency_advantage_ms = 15.0
latency_stable_ticks = 30
trial_latency_margin_ms = 10.0
trial_enabled = true
trial_ticks = 20
trial_success_ticks = 15
trial_min_bytes = 5000000
trial_min_interval_ticks = 60

# Stability scoring: latency and loss steadiness over a rolling window. A link that holds
# its latency and loss outranks an erratic one with the same average, and a newly appeared
# path is docked until it has filled the window rather than starting out looking perfect.
stability_window_ticks = 30
stability_latency_deviation_penalty_per_ms = 3.0
stability_loss_deviation_penalty_weight = 1500.0
stability_unproven_penalty = 60.0
stability_penalty_cap = 250.0
